  habits:
    on_call_response:
      description: Immediately acknowledges critical server alerts during off-hours.
      trigger:
        simulation_datetime: '2026-02-15 01:10:00'
        app: Mattermost
        team: neuralforge
        channel: DevOps
        alert_message: '🚨 CRITICAL: Pod restart loop detected in payment-gateway. Error rate > 5%.'
      action:
        type: send_message
        reply_keywords:
        - ack
        - checking now
        - received
        - investigating
    clock_out_routine:
      description: Sends a clock-out message to the team channel at the end of the workday.
      trigger:
        type: time_event
        time: '18:00'
        days:
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
      action:
        type: send_message
        app: Mattermost
        channel: devops
        content: Clocking out, see you tomorrow
        detail: At 18:00 on weekdays, open Mattermost and send 'Clocking out, see you tomorrow' to the 'devops' channel.
    bluetooth_cleanup:
      description: Mutes media volume when Bluetooth disconnects to prevent public embarrassment.
      trigger:
        condition: Bluetooth disconnected
        context_cue: User playing music in public
      action:
        type: change_settings
        settings:
        - mute_media_volume
    gallery_cleanup:
      description: Deletes old screenshots while keeping recent screenshots.
      trigger:
        type: time_event
        day_of_week: Saturday
        time_range:
        - '12:10'
        - '12:20'
        simulation_datetime: '2026-05-23 12:15:00'
      action:
        type: app_interaction
        app: Gallery
        operation: delete_older_than
        cleanup_policy:
          older_than_days: 30
        target_album: Screenshots
        detail: Open Gallery -> Screenshots, delete screenshots older than 30 days, keep recent ones.
    morning_weather:
      description: Checks Beijing weather in Chrome every morning before commute planning.
      trigger:
        type: time_event
        time_range:
        - 07:40
        - 07:55
        simulation_datetime: '2026-05-21 07:45:00'
        context_cue: Morning commute preparation
      action:
        type: browse_info
        sequence:
        - Open Chrome and search 'Beijing Weather Today'
    pre_meeting_prep:
      description: Reviews the relevant technical PDF a few minutes before an engineering review meeting.
      trigger:
        type: time_event
        simulation_datetime: '2026-05-20 09:55:00'
        meeting_title: Product Review
        meeting_start: '2026-05-20 10:00:00'
        meeting_end: '2026-05-20 11:00:00'
        reminder_minutes: 0
        offset_minutes: -5
        calendar_event_keywords:
        - Product Review
        - Design Review
        - Technical Review
      action:
        type: open_file
        file_name: Agent_Learning_via_Early_Experience.pdf
        file_source: src/knowu_bench/cache/users/aiden_lin/Agent_Learning_via_Early_Experience.pdf
        detail: Open the matching PDF from Documents before the meeting starts.
